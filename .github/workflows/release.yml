name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.6)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci --prefix ui
          pip install -r requirements.txt pyinstaller
          npm install --no-save @tauri-apps/cli@2

      - name: Build UI
        run: npm run ui:build

      - name: Build Windows Sidecar
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_sidecar.ps1

      - name: Build Windows Portable Executable & ZIP
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/workbuddy-tools.exe
            release/WorkBuddyTools-portable-win64.zip

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci --prefix ui
          pip install -r requirements.txt pyinstaller Pillow
          npm install --no-save @tauri-apps/cli@2

      - name: Build UI
        run: npm run ui:build

      - name: Build macOS Sidecar
        run: bash scripts/build_sidecar.sh

      - name: Build macOS Portable ZIP
        run: bash scripts/build_portable.sh

      - name: Build macOS DMG Bundle
        run: npx tauri build --bundles dmg

      - name: Collect macOS Artifacts
        run: |
          mkdir -p release/dmg
          cp src-tauri/target/release/bundle/dmg/*.dmg release/dmg/ 2>/dev/null || true

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/WorkBuddyTools-portable-macOS-*.zip
            release/dmg/*.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Dist Directory
        run: mkdir -p dist-release

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist-release

      - name: Flatten Files & Generate Checksums
        run: |
          cd dist-release
          find . -mindepth 2 -type f -exec mv -t . -i '{}' + 2>/dev/null || true
          find . -type d -empty -delete 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Assets & Checksums ==="
          cat SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG
        run: |
          python scripts/extract_changelog.py "${{ env.TAG }}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
