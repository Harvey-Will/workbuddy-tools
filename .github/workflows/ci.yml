name: CI

on:
  push:
    branches: [ main, "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Unit Tests
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Run unit tests
        run: python -m unittest discover -s tests

  frontend-build:
    name: Frontend Build
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install UI dependencies and build
        run: |
          npm ci --prefix ui
          npm run build --prefix ui

  rust-check:
    name: Rust Cargo Check
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare placeholder sidecar and dist for cargo check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries ui/dist
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          # lib.rs embeds the binary named after the host triple.
          cp /dev/null "src-tauri/binaries/sidecar-$TRIPLE" 2>/dev/null || true
          for f in sidecar-x86_64-pc-windows-msvc.exe sidecar-aarch64-pc-windows-msvc.exe sidecar-aarch64-apple-darwin sidecar-x86_64-apple-darwin sidecar-x86_64-unknown-linux-gnu; do
            printf 'placeholder' > "src-tauri/binaries/$f"
          done
          echo '<!doctype html><html><body></body></html>' > ui/dist/index.html
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  macos-build:
    name: macOS Bundle Build
    runs-on: macos-latest
    needs: [python-tests, frontend-build, rust-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Build sidecar (PyInstaller)
        run: bash scripts/build_sidecar.sh
      - name: Build UI
        run: npm run ui:build
      - name: Build app bundle
        run: npx tauri build --bundles app
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyTools-macOS
          path: |
            src-tauri/target/release/bundle/app/
            src-tauri/target/release/bundle/dmg/
