<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A2: abstract open bracket + dot — "local vault / tools panel" -->
  <rect width="256" height="256" rx="56" fill="#0F172A"/>
  <!-- left rail -->
  <rect x="48" y="48" width="28" height="160" rx="14" fill="#3B82F6"/>
  <!-- tool cross -->
  <g transform="translate(112 72)" fill="#34D399">
    <rect x="28" y="0" width="20" height="48" rx="10"/>
    <rect x="0" y="28" width="76" height="20" rx="10"/>
    <circle cx="38" cy="38" r="10" fill="#0F172A"/>
  </g>
  <!-- stacked bars = data -->
  <rect x="112" y="148" width="96" height="12" rx="6" fill="#94A3B8"/>
  <rect x="112" y="172" width="72" height="12" rx="6" fill="#64748B"/>
  <rect x="112" y="196" width="84" height="12" rx="6" fill="#475569"/>
</svg>
