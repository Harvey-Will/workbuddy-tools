<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A4: monoline T + gear — modern wordmark mark -->
  <rect width="256" height="256" rx="56" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
  <g transform="translate(128 128)">
    <!-- gear ring -->
    <circle r="70" fill="none" stroke="#0F172A" stroke-width="16"/>
    <g fill="#0F172A">
      <rect x="-10" y="-92" width="20" height="28" rx="6"/>
      <rect x="-10" y="64" width="20" height="28" rx="6"/>
      <rect x="-92" y="-10" width="28" height="20" rx="6"/>
      <rect x="64" y="-10" width="28" height="20" rx="6"/>
      <rect x="-10" y="-92" width="20" height="28" rx="6" transform="rotate(45)"/>
      <rect x="-10" y="64" width="20" height="28" rx="6" transform="rotate(45)"/>
      <rect x="-92" y="-10" width="28" height="20" rx="6" transform="rotate(45)"/>
      <rect x="64" y="-10" width="28" height="20" rx="6" transform="rotate(45)"/>
    </g>
    <!-- T bar -->
    <rect x="-36" y="-18" width="72" height="18" rx="9" fill="#3B82F6"/>
    <rect x="-9" y="-18" width="18" height="54" rx="9" fill="#3B82F6"/>
  </g>
</svg>
